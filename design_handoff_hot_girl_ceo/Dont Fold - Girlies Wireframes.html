<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Don't Fold · Girlies Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Permanent+Marker&family=Architects+Daughter&family=Bricolage+Grotesque:wght@600;800&family=Instrument+Serif:ital@0;1&family=Space+Grotesque:wght@400;500;700&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#f0eee9; font-family: "Patrick Hand", system-ui; }
  /* sketchy paper feel */
  .sketch { color:#1a1815; }
  .ink { stroke:#1a1815; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  /* Phone frame, low-fi */
  .phone {
    position:relative;
    width:280px; height:580px;
    background:#fffdf7;
    border-radius:30px;
    border: 2px solid #1a1815;
    box-shadow: 3px 3px 0 #1a1815;
    overflow:hidden;
    font-family: "Patrick Hand", system-ui;
    color:#1a1815;
  }
  .phone.notch::before {
    content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:80px; height:18px; background:#1a1815; border-radius:12px; z-index:2;
  }
  .phone.notch::after {
    content:"9:41"; position:absolute; top:12px; left:18px; font-family:"Space Mono", monospace; font-size:10px; z-index:2;
  }
  .phone .battery { position:absolute; top:12px; right:18px; font-family:"Space Mono", monospace; font-size:10px; z-index:2; }
  .screen { position:absolute; inset: 36px 0 0 0; overflow:hidden; padding:14px 16px 16px; box-sizing:border-box; }
  .home-indicator { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:80px; height:3px; background:#1a1815; border-radius:2px; opacity:.6; }

  /* utility */
  .row { display:flex; align-items:center; gap:8px; }
  .stack { display:flex; flex-direction:column; }
  .gap-6 > * + * { margin-top: 6px; }
  .gap-8 > * + * { margin-top: 8px; }
  .gap-10 > * + * { margin-top: 10px; }
  .gap-12 > * + * { margin-top: 12px; }

  /* hand-drawn boxes */
  .scribble-box {
    border: 2px solid #1a1815;
    border-radius: 14px;
    padding: 10px 12px;
    background:#fffdf7;
    position:relative;
  }
  .scribble-box.tilt-l { transform: rotate(-0.6deg); }
  .scribble-box.tilt-r { transform: rotate(0.5deg); }

  /* squiggle underline */
  .squiggle { display:inline-block; position:relative; }
  .squiggle::after {
    content:""; position:absolute; left:-2px; right:-2px; bottom:-6px; height:6px;
    background: radial-gradient(circle at 4px 3px, currentColor 1.2px, transparent 1.6px) repeat-x;
    background-size: 8px 6px;
    opacity:.7;
  }

  /* DIRECTION 1: HOT GIRL CEO — black + hot pink + cream */
  .d1 { --bg:#fffdf7; --ink:#0d0d0d; --accent:#ff2d87; --soft:#ffe6f0; }
  .d1 .phone { background:var(--bg); border-color:var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .d1 h1 { font-family:"Bricolage Grotesque", sans-serif; font-weight:800; font-size: 38px; line-height: .9; margin:0; letter-spacing:-1px; color:var(--ink); }
  .d1 h1 .pink { color:var(--accent); }
  .d1 .eyebrow { font-family:"Space Mono", monospace; font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink); }
  .d1 .card { background:var(--bg); border:2px solid var(--ink); border-radius:12px; padding:10px 12px; position:relative; }
  .d1 .card.hi { background:var(--soft); }
  .d1 .card .ttl { font-family:"Bricolage Grotesque", sans-serif; font-weight:800; font-size:15px; letter-spacing:-.3px; }
  .d1 .card .sub { font-family:"Patrick Hand"; font-size:12px; color:#33312d; line-height:1.2; }
  .d1 .chip { background:var(--ink); color:var(--bg); border-radius:99px; padding:3px 8px; font-family:"Space Mono", monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; display:inline-block; }
  .d1 .chip.acc { background:var(--accent); color:var(--ink); }
  .d1 .star { color:var(--accent); }

  /* DIRECTION 2: SOFT POWER — cream + cherry + dusty rose, italic serif */
  .d2 { --bg:#f8efe3; --ink:#2a1517; --cherry:#c41e3a; --rose:#e8b8a6; --blush:#f3d5cc; }
  .d2 .phone { background:var(--bg); border-color:var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .d2 h1 { font-family:"Instrument Serif", serif; font-style:italic; font-weight:400; font-size:40px; line-height:.95; margin:0; color:var(--ink); }
  .d2 h1 .red { color:var(--cherry); font-style:italic; }
  .d2 .eyebrow { font-family:"Space Mono", monospace; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--cherry); }
  .d2 .card { background:#fffaf2; border:1.5px solid var(--ink); border-radius:6px; padding:10px 12px; position:relative; }
  .d2 .card.hi { background:var(--blush); }
  .d2 .card .ttl { font-family:"Instrument Serif", serif; font-style:italic; font-size:18px; line-height:1.15; }
  .d2 .card .sub { margin-top:4px; }
  .d2 .card .sub { font-family:"Cormorant Garamond", serif; font-style:italic; font-size:13px; color:#3a2225; line-height:1.25; }
  .d2 .seal { width:38px; height:38px; border-radius:50%; background:var(--cherry); color:var(--bg); display:flex; align-items:center; justify-content:center; font-family:"Instrument Serif"; font-style:italic; font-size:18px; }

  /* DIRECTION 3: BRAT MODE — chartreuse + black */
  .d3 { --bg:#c8ff00; --ink:#0a0a0a; --cream:#fffdf7; --accent:#ff3b9a; }
  .d3 .phone { background:var(--bg); border-color:var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .d3 h1 { font-family:"Bricolage Grotesque"; font-weight:800; font-size:42px; line-height:.85; margin:0; letter-spacing:-2px; color:var(--ink); text-transform:lowercase; }
  .d3 h1 .x { text-decoration: line-through; text-decoration-thickness: 3px; }
  .d3 .eyebrow { font-family:"Space Mono", monospace; font-size:9px; letter-spacing:.2em; text-transform:lowercase; color:var(--ink); }
  .d3 .card { background:var(--cream); border:2px solid var(--ink); border-radius:0; padding:10px 12px; position:relative; }
  .d3 .card.hi { background:var(--ink); color:var(--bg); }
  .d3 .card .ttl { font-family:"Bricolage Grotesque"; font-weight:800; font-size:14px; letter-spacing:-.5px; text-transform:lowercase; }
  .d3 .card .sub { font-family:"Patrick Hand"; font-size:12px; line-height:1.15; }
  .d3 .tag { background:var(--ink); color:var(--bg); padding:2px 6px; font-family:"Space Mono"; font-size:9px; letter-spacing:.1em; text-transform:lowercase; display:inline-block; }

  /* shared screen bits */
  .sb-bar { display:flex; gap:3px; height:6px; align-items:center; }
  .sb-bar i { display:block; flex:1; height:6px; border:1.5px solid currentColor; border-radius:2px; }
  .sb-bar i.on { background: currentColor; }

  .stat-row { display:flex; justify-content:space-between; gap:6px; font-family:"Space Mono", monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
  .stat-row b { display:block; font-size:14px; font-family:"Bricolage Grotesque"; font-weight:800; letter-spacing:-.5px; text-transform:none; }

  /* message bubbles */
  .bubble { padding:8px 10px; border-radius:14px; max-width:78%; font-size:12px; line-height:1.25; font-family:"Patrick Hand"; }
  .msg.them { display:flex; gap:6px; align-items:flex-start; }
  .msg.you { display:flex; justify-content:flex-end; }

  /* hand-drawn corners helpers */
  .scrib-tag {
    font-family:"Caveat"; font-weight:700; font-size:14px;
    display:inline-block; transform:rotate(-3deg);
  }
  .arrow-note {
    font-family:"Caveat"; font-size:13px; color:#1a1815; position:absolute;
  }

  .legend {
    font-family:"Caveat", cursive; font-size:14px; color:#3a3a3a;
  }

  /* big section heading */
  .section-name {
    font-family:"Permanent Marker"; font-size:28px; line-height:1; color:#1a1815;
  }
  .section-blurb {
    font-family:"Caveat", cursive; font-size:18px; color:#3a3a3a; line-height:1.2;
  }

  /* mic dot */
  .mic {
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:2px solid currentColor;
  }

  /* generic input bar */
  .inputbar {
    border:1.5px dashed currentColor; border-radius:99px; padding:8px 12px; font-family:"Patrick Hand"; font-size:11px; opacity:.7;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
